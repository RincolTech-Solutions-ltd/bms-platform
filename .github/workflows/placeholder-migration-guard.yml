name: Placeholder migration guard

# A branch that cannot know the next free Flyway number names its migration V99. Flyway runs with outOfOrder off, so a V99 that
# reaches a server makes every later migration (V61 to V98 and up) a number below an applied one, and none of them can run.
# This fails any pull request that still holds a V99 file, until the maintainer renumbers it (or writes RENUMBERED in the
# description on purpose), and any push to main that holds one. It also runs when the description is edited, so adding the word
# is enough to turn it green. See .github/scripts/placeholder_migration_guard.py.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  placeholder:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","jerome-laptop"]') }}
    steps:
      - uses: actions/checkout@v7
      - name: No migration may keep the placeholder number V99
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .github/scripts/placeholder_migration_guard.py
