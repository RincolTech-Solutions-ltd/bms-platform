bms:
  tenancy:
    # Hyphenated hosts under one zone, as on staging (ADR-018). TestRestTemplate calls localhost,
    # which is the platform host here.
    tenant-host-pattern: "{slug}-bms-staging.rincoltech.test"
    platform-host: localhost
    allow-tenant-header: true
  auth:
    mode: dev
  storage:
    provider: fake
    # Fixed so a test can sign an expired URL itself (FR-DOC-03).
    fake-secret: test-only-fake-storage-secret
    # argon2id at test cost. The PHC string carries its parameters, so every hash still verifies;
    # other profiles use the chapter 8 cost (64 MiB, 3 iterations).
    argon2-memory-kib: 4096
    argon2-iterations: 2
  # The recording stub, so no test can reach a provider; the adapter's own tests use a local server.
  ai:
    provider: recording
    model: test-model
    platform-daily-tokens: 100000
    platform-daily-cost-micro: 1000000
    tenant-daily-tokens: 10000
    tenant-daily-cost-micro: 500000
    price-input-micro-per-million: 1000000
    price-output-micro-per-million: 2000000
  # High global caps, so the whole suite's sign-ups fit in one hour; OnboardingIT fills them on
  # purpose to prove the cap.
  onboarding:
    max-applications-per-hour: 400
    max-verification-emails-per-hour: 400

management:
  server:
    port: 0
